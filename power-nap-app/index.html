<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1226" />
  <title>NapForge — Power Nap Alarm</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="dark">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">😴</span>
      <span class="brand-name">NapForge</span>
    </div>
    <div class="topbar-actions">
      <button id="stats-btn" class="icon-btn" title="Nap statistics">📊</button>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
      <button id="theme-btn" class="icon-btn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main>
    <!-- ============ SETUP SCREEN ============ -->
    <section id="screen-setup" class="screen active">
      <h1 class="headline">Recharge with a perfect nap</h1>
      <p class="subhead">Pick a duration. To silence the alarm you'll have to beat a challenge — no half-asleep snoozing allowed.</p>

      <div class="preset-grid">
        <button class="preset-card" data-minutes="10">
          <span class="preset-emoji">⚡</span>
          <span class="preset-time">10 min</span>
          <span class="preset-name">Micro Nap</span>
          <span class="preset-desc">Quick alertness boost</span>
        </button>
        <button class="preset-card recommended" data-minutes="20">
          <span class="preset-badge">Recommended</span>
          <span class="preset-emoji">🔋</span>
          <span class="preset-time">20 min</span>
          <span class="preset-name">Power Nap</span>
          <span class="preset-desc">Energy without grogginess</span>
        </button>
        <button class="preset-card" data-minutes="26">
          <span class="preset-emoji">🚀</span>
          <span class="preset-time">26 min</span>
          <span class="preset-name">NASA Nap</span>
          <span class="preset-desc">Proven pilot performance boost</span>
        </button>
        <button class="preset-card" data-minutes="90">
          <span class="preset-emoji">🌙</span>
          <span class="preset-time">90 min</span>
          <span class="preset-name">Full Cycle</span>
          <span class="preset-desc">One complete sleep cycle</span>
        </button>
      </div>

      <div class="custom-row">
        <label for="custom-minutes">Custom:</label>
        <input id="custom-minutes" type="number" min="1" max="180" value="15" />
        <span>minutes</span>
        <button id="custom-start" class="btn btn-secondary">Start custom nap</button>
      </div>

      <div class="quick-options">
        <div class="option-pill">
          <label for="challenge-select">Wake-up challenge</label>
          <select id="challenge-select">
            <option value="random" selected>🎲 Surprise me</option>
            <option value="math">🧮 Math Quiz</option>
            <option value="memory">🧠 Memory Sequence</option>
            <option value="typing">⌨️ Typing Test</option>
            <option value="bubbles">🎯 Bubble Pop</option>
          </select>
        </div>
        <div class="option-pill">
          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select">
            <option value="easy">😌 Easy</option>
            <option value="medium" selected>🙂 Medium</option>
            <option value="hard">😤 Hard</option>
          </select>
        </div>
        <div class="option-pill">
          <label for="ambient-select">Ambient sound</label>
          <select id="ambient-select">
            <option value="none" selected>🔇 None</option>
            <option value="white">🌫️ White noise</option>
            <option value="brown">🟤 Brown noise</option>
            <option value="rain">🌧️ Rain</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ============ NAP (COUNTDOWN) SCREEN ============ -->
    <section id="screen-nap" class="screen">
      <div class="nap-stage">
        <div class="stars" aria-hidden="true"></div>
        <svg class="progress-ring" viewBox="0 0 260 260" width="260" height="260">
          <circle class="ring-bg" cx="130" cy="130" r="118" />
          <circle class="ring-fg" cx="130" cy="130" r="118" />
        </svg>
        <div class="nap-readout">
          <div id="nap-time" class="nap-time">20:00</div>
          <div id="nap-wake-at" class="nap-wake-at">wakes at --:--</div>
          <div id="nap-zzz" class="nap-zzz">z z Z</div>
        </div>
      </div>
      <div class="nap-controls">
        <button id="nap-extend" class="btn btn-secondary">+5 min</button>
        <button id="nap-cancel" class="btn btn-danger">Cancel nap</button>
        <button id="nap-test-alarm" class="btn btn-ghost" title="Skip straight to the alarm to try the challenge">Test alarm</button>
      </div>
      <p class="nap-hint" id="ambient-hint"></p>
    </section>

    <!-- ============ ALARM SCREEN ============ -->
    <section id="screen-alarm" class="screen">
      <div class="alarm-banner">
        <span class="alarm-bell">⏰</span>
        <h2>WAKE UP!</h2>
        <p id="alarm-subtitle">Beat the challenge to stop the alarm</p>
      </div>

      <div id="challenge-area" class="challenge-area">
        <!-- Challenge UI injected by JS -->
      </div>

      <div class="alarm-footer">
        <button id="snooze-btn" class="btn btn-secondary">😪 Snooze <span id="snooze-info"></span></button>
        <div class="snooze-warning" id="snooze-warning"></div>
      </div>
    </section>

    <!-- ============ WAKE SUCCESS SCREEN ============ -->
    <section id="screen-awake" class="screen">
      <div class="awake-card">
        <div class="awake-emoji">🌅</div>
        <h2>You're awake!</h2>
        <p id="awake-summary"></p>
        <div class="awake-stats" id="awake-stats"></div>
        <button id="awake-done" class="btn btn-primary">Back to home</button>
      </div>
    </section>
  </main>

  <!-- ============ STATS MODAL ============ -->
  <dialog id="stats-modal" class="modal">
    <h2>📊 Your nap stats</h2>
    <div id="stats-content" class="stats-grid"></div>
    <h3>Recent naps</h3>
    <ul id="stats-history" class="history-list"></ul>
    <div class="modal-actions">
      <button id="stats-reset" class="btn btn-danger">Reset stats</button>
      <button id="stats-close" class="btn btn-primary">Close</button>
    </div>
  </dialog>

  <!-- ============ SETTINGS MODAL ============ -->
  <dialog id="settings-modal" class="modal">
    <h2>⚙️ Settings</h2>
    <div class="settings-list">
      <label class="setting-row">
        <span>Snooze length (minutes)</span>
        <input id="set-snooze-length" type="number" min="1" max="15" value="5" />
      </label>
      <label class="setting-row">
        <span>Max snoozes per nap</span>
        <input id="set-max-snoozes" type="number" min="0" max="5" value="2" />
      </label>
      <label class="setting-row">
        <span>Escalating alarm volume</span>
        <input id="set-escalate" type="checkbox" checked />
      </label>
      <label class="setting-row">
        <span>Vibration (supported devices)</span>
        <input id="set-vibrate" type="checkbox" checked />
      </label>
      <label class="setting-row">
        <span>Keep screen awake during nap</span>
        <input id="set-wakelock" type="checkbox" checked />
      </label>
      <label class="setting-row">
        <span>Snooze penalty (harder challenge each snooze)</span>
        <input id="set-snooze-penalty" type="checkbox" checked />
      </label>
    </div>
    <div class="modal-actions">
      <button id="settings-close" class="btn btn-primary">Done</button>
    </div>
  </dialog>

  <script src="js/audio.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
